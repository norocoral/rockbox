# =============================================================================
# Innioasis Y1 Build Configuration (build.conf)
# =============================================================================
# Edit this file directly or run `./build.sh --gui` for the interactive TUI.

# --- Core Hardware & System Components ---
BUILD_LIBY1=1
BUILD_ROOTFS=1
BUILD_BOOTIMG=1
BUILD_VIDEO_LIB=1

# --- Application Target ---
# Build Rockbox into .rockbox/ on the SD card package.
# Set BUILD_ROCKBOX=0 to build a standalone Y1 Linux SDK/OS image without Rockbox.
BUILD_ROCKBOX=1

# Optional standalone C application binary to install at /.system/app on the SD card.
# If set and present at boot, init will launch /.system/app directly.
CUSTOM_APP_BIN=""

# --- Packaging Options ---
PACKAGE_SDCARD=1
BUNDLE_BT_BLOBS=1
BUNDLE_ANDROID_RAMDISK=1

# --- Toolchain & Parallelism ---
CROSS_COMPILE="arm-linux-gnueabihf-"
USE_CCACHE=1
# Set JOBS=0 to auto-detect CPU core count via nproc
JOBS=0

